<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qui est ce Pokémon ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1A2B;
    --panel:#17263B;
    --edge:#28405C;
    --paper:#EEF4FA;
    --text:#DCE7F3;
    --mute:#7E93AC;
    --amber:#FFC93C;
    --good:#37D6A4;
    --bad:#FF6B72;
    --font:"Space Grotesk","Trebuchet MS",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #1B2E48 0%, var(--ink) 55%),
      var(--ink);
    color:var(--text);
    font-family:var(--font);
    display:flex;
    justify-content:center;
    padding:20px 16px 32px;
  }
  .layout{width:100%;max-width:1060px;display:grid;grid-template-columns:1fr;gap:30px;justify-items:center}
  .shell{width:100%;max-width:520px;display:flex;flex-direction:column;gap:20px}

  /* ---------- barre d'état ---------- */
  .status{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .title{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0}
  .counts{font-size:13px;color:var(--mute);white-space:nowrap}
  .counts b{color:var(--text);font-weight:500}
  .streak{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mute)}
  .led{width:9px;height:9px;border-radius:50%;background:var(--edge);transition:background .2s}
  .led.on{background:var(--amber);box-shadow:0 0 10px rgba(255,201,60,.55)}

  /* ---------- scène ---------- */
  .stage{display:flex;justify-content:center}
  .well{
    width:min(74vw,330px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 50% 38%, #FFFFFF 0%, var(--paper) 58%, #C9D8E7 100%);
    border:3px solid var(--edge);
    box-shadow:0 18px 44px rgba(0,0,0,.45), inset 0 -14px 30px rgba(23,38,59,.18);
    display:grid;place-items:center;position:relative;overflow:hidden;
  }
  .well img{width:82%;height:82%;object-fit:contain;opacity:0;transition:opacity .25s}
  .well img.px{width:74%;height:74%;image-rendering:pixelated}
  .well img.shown{opacity:1}
  .spinner{
    position:absolute;width:26px;height:26px;border-radius:50%;
    border:3px solid #C9D8E7;border-top-color:#4E6C8E;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .well.error{background:var(--panel)}
  .wellmsg{position:absolute;padding:0 28px;text-align:center;font-size:14px;color:var(--mute)}

  /* ---------- saisie ---------- */
  .ask{display:flex;gap:8px}
  input[type=text]{
    flex:1;min-width:0;font:500 17px/1 var(--font);color:var(--text);
    background:var(--panel);border:2px solid var(--edge);border-radius:12px;
    padding:14px 15px;
  }
  input[type=text]::placeholder{color:#5D7A99}
  input[type=text]:focus{outline:none;border-color:var(--amber)}
  button{font:500 15px/1 var(--font);cursor:pointer;border-radius:12px;border:2px solid transparent}
  button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  .primary{background:var(--amber);color:#12213A;font-weight:700;padding:14px 20px}
  .primary:hover{background:#FFD666}
  .wide{width:100%;padding:15px}
  .aux{display:flex;gap:18px;justify-content:center}
  .link{background:none;color:var(--mute);padding:6px 2px;text-decoration:underline;text-underline-offset:3px}
  .link:hover{color:var(--text)}
  .hint{text-align:center;font-size:15px;color:var(--amber);letter-spacing:.28em;min-height:20px}

  /* ---------- révélation ---------- */
  .answer{
    background:var(--panel);border:2px solid var(--edge);border-radius:16px;
    padding:18px;display:flex;flex-direction:column;gap:14px;align-items:center;
    animation:rise .26s ease-out;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .verdict{font-size:14px;font-weight:500}
  .verdict.ok{color:var(--good)}
  .verdict.no{color:var(--bad)}
  .name{font-size:31px;font-weight:700;letter-spacing:-.02em;text-align:center;line-height:1.1;margin:-4px 0 0}
  .alt{font-size:14px;color:var(--mute);margin:-8px 0 0}
  .meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
  .type{padding:5px 13px;border-radius:999px;font-size:13px;font-weight:700}
  .gen{padding:5px 13px;border-radius:999px;font-size:13px;border:2px solid var(--edge);color:var(--mute)}

  /* ---------- générations ---------- */
  .gens{border-top:1px solid var(--edge);padding-top:16px;display:flex;flex-direction:column;gap:11px}
  .gens h2{margin:0;font-size:13px;font-weight:500;color:var(--mute)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{background:none;border:2px solid var(--edge);color:var(--mute);padding:7px 11px;font-size:13px}
  .chip[aria-pressed=true]{border-color:var(--amber);color:#12213A;background:var(--amber);font-weight:700}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .tiny{font-size:12px;color:var(--mute)}

  /* ---------- panneau de progression ---------- */
  .progress{width:100%;max-width:520px;display:flex;flex-direction:column;gap:22px}
  .phead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:9px}
  .phead h3{margin:0;font-size:14px;font-weight:500}
  .phead .score{font-size:13px;color:var(--mute);white-space:nowrap}
  .phead .score b{color:var(--good);font-weight:700}
  .bar{height:3px;border-radius:2px;background:var(--edge);overflow:hidden;margin-bottom:11px}
  .bar i{display:block;height:100%;background:var(--good);transition:width .35s ease-out}
  #pgroups{display:flex;flex-direction:column;gap:24px}
  .dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:5px}
  .dot{
    aspect-ratio:1;border-radius:50%;border:2px solid var(--edge);background:none;padding:0;
    display:grid;place-items:center;overflow:hidden;cursor:default;
  }
  .dot.miss{border-color:rgba(255,107,114,.55);border-style:dashed}
  .dot.got{border-color:var(--good);background:rgba(55,214,164,.14)}
  .dot img{width:158%;height:158%;object-fit:contain;image-rendering:pixelated}
  .dot.pop{animation:pop .45s ease-out}
  @keyframes pop{0%{transform:scale(.35)}62%{transform:scale(1.2)}100%{transform:scale(1)}}
  @media (min-width:900px){
    .layout{grid-template-columns:minmax(0,480px) minmax(0,1fr);align-items:start;justify-items:stretch;gap:44px}
    .progress{position:sticky;top:20px;max-height:calc(100vh - 52px);overflow-y:auto;padding-right:6px}
    .progress::-webkit-scrollbar{width:8px}
    .progress::-webkit-scrollbar-thumb{background:var(--edge);border-radius:4px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="layout">
<main class="shell">

  <div class="status">
    <h1 class="title">Qui est ce Pokémon&nbsp;?</h1>
    <div class="counts"><b id="cGood">0</b> / <span id="cSeen">0</span></div>
  </div>

  <div class="streak" id="streakBox">
    <span class="led"></span><span class="led"></span><span class="led"></span>
    <span class="led"></span><span class="led"></span>
    <span id="streakTxt">série 0 · record 0</span>
  </div>

  <div class="stage">
    <div class="well" id="well">
      <div class="spinner" id="spinner"></div>
      <img id="art" alt="Pokémon à reconnaître">
      <p class="wellmsg" id="wellmsg" hidden></p>
    </div>
  </div>

  <div id="askZone">
    <div class="ask">
      <input type="text" id="guess" placeholder="Son nom…" autocomplete="off"
             autocapitalize="off" spellcheck="false" enterkeyhint="done">
      <button class="primary" id="check">Valider</button>
    </div>
    <p class="hint" id="hint"></p>
    <div class="aux">
      <button class="link" id="hintBtn">Indice</button>
      <button class="link" id="giveUp">Je ne sais pas</button>
    </div>
  </div>

  <div class="answer" id="answer" hidden>
    <p class="verdict" id="verdict"></p>
    <p class="name" id="name"></p>
    <p class="alt" id="alt"></p>
    <div class="meta" id="meta"></div>
    <button class="primary wide" id="next">Suivant</button>
  </div>

  <section class="gens">
    <div class="row">
      <h2>Générations en jeu</h2>
      <button class="link" id="reset">Repartir de zéro</button>
    </div>
    <div class="chips" id="chips"></div>
    <p class="tiny" id="revisionTxt"></p>
  </section>

</main>

<aside class="progress" id="progress" aria-label="Pokémon déjà trouvés">
  <div class="row">
    <h2 class="tiny" id="totalTxt"></h2>
    <button class="link" id="modeBtn">Afficher des pastilles</button>
  </div>
  <div id="pgroups"></div>
</aside>
</div>

/* ---------- persistance (silencieuse si indisponible) ---------- */
async function load(){
  let raw = null;
  try{ const r = await window.storage.get(KEY); if(r && r.value) raw = r.value; }catch(e){}
  if(raw === null){ try{ raw = localStorage.getItem(KEY); }catch(e){} }
  if(raw) try{ state = Object.assign(state, JSON.parse(raw)); }catch(e){}
}
async function save(){
  const v = JSON.stringify(state);
  let done = false;
  try{ done = !!(await window.storage.set(KEY, v)); }catch(e){}
  if(!done) try{ localStorage.setItem(KEY, v); }catch(e){}
}

/* ---------- comparaison des noms ---------- */
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
function lev(a,b){
  if(Math.abs(a.length-b.length)>1) return 2;
  const m=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length).fill(0)]);
  for(let j=0;j<=b.length;j++) m[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    m[i][j]=Math.min(m[i-1][j]+1, m[i][j-1]+1, m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length];
}

/* ---------- tirage ---------- */
function pool(){
  const ids=[];
  for(const g of GENS) if(state.gens.includes(g.n))
    for(let i=g.r[0]; i<=g.r[1]; i++) ids.push(i);
  return ids;
}
function pick(){
  const ids = pool();
  if(!ids.length) return null;
  const review = Object.keys(state.misses).map(Number).filter(id => ids.includes(id) && state.misses[id]>0);
  let id;
  if(review.length && Math.random() < 0.4) id = review[Math.floor(Math.random()*review.length)];
  else id = ids[Math.floor(Math.random()*ids.length)];
  if(id===lastId && ids.length>1) return pick();
  return id;
}

/* ---------- données (embarquées dans le fichier) ---------- */
function getMon(id){
  const d = DEX[id];
  return {id, fr:d[0], en:d[1], gen:d[2], types:d.slice(3)};
}
function probeHD(){
  const im = new Image();
  const stop = setTimeout(() => { im.onload = im.onerror = null; }, 6000);
  im.onload = () => { clearTimeout(stop); hdOK = true; };
  im.src = HD(25);
}

/* ---------- affichage ---------- */
function renderStreak(){
  document.querySelectorAll(".led").forEach((d,i)=>d.classList.toggle("on", i < Math.min(streak,5)));
  el("streakTxt").textContent = `série ${streak} · record ${state.best}`;
  el("cGood").textContent = state.good;
  el("cSeen").textContent = state.seen;
  const n = Object.values(state.misses).filter(v=>v>0).length;
  el("revisionTxt").textContent = n ? `${n} Pokémon dans la pile de révision — ils reviennent plus souvent.` : "";
}
/* ---------- grille de progression ---------- */
function fillDot(b, id){
  const name = state.found[id];
  b.className = "dot" + (name ? " got" : (state.misses[id] > 0 ? " miss" : ""));
  b.title = name ? `n°${id} · ${name}` : `n°${id} · pas encore trouvé`;
  if(name && state.sprites){
    b.innerHTML = "";
    const im = new Image();
    im.src = LOCAL(id); im.alt = name;
    b.appendChild(im);
  } else {
    b.innerHTML = "";
  }
}
function renderProgress(){
  const box = el("pgroups");
  box.innerHTML = "";
  let got = 0, tot = 0;
  for(const g of GENS){
    if(!state.gens.includes(g.n)) continue;
    const size = g.r[1] - g.r[0] + 1;
    let n = 0;
    const grid = document.createElement("div");
    grid.className = "dots";
    for(let id = g.r[0]; id <= g.r[1]; id++){
      const b = document.createElement("div");
      b.dataset.id = id;
      fillDot(b, id);
      if(state.found[id]) n++;
      grid.appendChild(b);
    }
    got += n; tot += size;

    const sec = document.createElement("section");
    sec.innerHTML =
      `<div class="phead"><h3>Génération ${ROMAN[g.n]} · ${g.region}</h3>
       <p class="score"><b data-got="${g.n}">${n}</b> / ${size}</p></div>
       <div class="bar"><i data-bar="${g.n}" style="width:${n/size*100}%"></i></div>`;
    sec.appendChild(grid);
    box.appendChild(sec);
  }
  el("totalTxt").textContent = tot ? `${got} Pokémon retrouvés sur ${tot}` : "";
  el("modeBtn").textContent = state.sprites ? "Afficher des pastilles" : "Afficher les images";
}
function markDot(id){
  const b = el("pgroups").querySelector(`[data-id="${id}"]`);

    const c = el("pgroups").querySelector(`[data-got="${g.n}"]`);
    const bar = el("pgroups").querySelector(`[data-bar="${g.n}"]`);
    if(c) c.textContent = n;
    if(bar) bar.style.width = n / size * 100 + "%";
    let got = 0, tot = 0;
    for(const gg of GENS) if(state.gens.includes(gg.n)){
      tot += gg.r[1] - gg.r[0] + 1;
      for(let i = gg.r[0]; i <= gg.r[1]; i++) if(state.found[i]) got++;
    }
    el("totalTxt").textContent = `${got} Pokémon retrouvés sur ${tot}`;
  }
}

function renderChips(){
  el("chips").innerHTML = "";
  for(const g of GENS){
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = `${ROMAN[g.n]} · ${g.region}`;
    b.setAttribute("aria-pressed", state.gens.includes(g.n));
    b.onclick = () => {
      state.gens = state.gens.includes(g.n) ? state.gens.filter(x=>x!==g.n) : [...state.gens, g.n];
      if(!state.gens.length) state.gens = [g.n];
      save(); renderChips(); renderProgress(); nextId = null; round();
    };
    el("chips").appendChild(b);
  }
}
function wellMessage(txt){
  el("spinner").hidden = true;
  el("art").classList.remove("shown");
  el("wellmsg").hidden = false;
  el("wellmsg").textContent = txt;
}

/* ---------- déroulé d'une manche ---------- */
function round(){
  revealed = false; hinted = false;
  el("answer").hidden = true;
  el("askZone").hidden = false;
  el("hint").textContent = "";
  el("guess").value = "";
  el("wellmsg").hidden = true;
  el("spinner").hidden = false;
  el("guess").focus();

  const id = (nextId && DEX[nextId] && pool().includes(nextId)) ? nextId : pick();
  nextId = null;
  if(!id){ el("spinner").hidden = true; wellMessage("Choisis au moins une génération pour commencer."); return; }

  current = getMon(id); lastId = id;
  const art = el("art");
  art.className = "";
  art.onload = () => { el("spinner").hidden = true; art.classList.add("shown"); };
  art.onerror = () => {                      // réseau refusé : on bascule sur le sprite embarqué
    hdOK = false; art.onerror = null;
    art.className = "px"; art.src = LOCAL(id);
  };
  if(hdOK){ art.src = HD(id); }
  else { art.className = "px"; art.src = LOCAL(id); }

  nextId = pick();
  if(nextId && hdOK){ const pre = new Image(); pre.src = HD(nextId); }
}

function reveal(result){
  revealed = true;
  el("askZone").hidden = true;
  el("answer").hidden = false;

  state.seen++;
  if(result === "ok" || result === "near"){
    state.good++; streak++;
    state.best = Math.max(state.best, streak);
    state.misses[current.id] = Math.max(0, (state.misses[current.id]||0) - 1);
    state.found[current.id] = current.fr;
  } else {
    streak = 0;
    state.misses[current.id] = Math.min(3, (state.misses[current.id]||0) + 2);
  }
  markDot(current.id);

  const v = el("verdict");
  v.className = "verdict " + (result === "no" ? "no" : "ok");
  v.textContent = result === "ok" ? "Bien vu." : result === "near" ? "Presque — c'était bien lui." : "Raté.";

  el("name").textContent = current.fr;
  el("alt").textContent = current.en !== current.fr ? `${current.en} · n°${String(current.id).padStart(3,"0")}`
                                                    : `n°${String(current.id).padStart(3,"0")}`;
  const g = GENS.find(x=>x.n===current.gen) || {region:"?"};
  el("meta").innerHTML = "";
  for(const t of current.types){
    const [label,color] = TYPES[t] || [t,"#777"];
    const s = document.createElement("span");
    s.className = "type"; s.textContent = label;
    s.style.background = color;
    s.style.color = parseInt(color.slice(1,3),16)*.299 + parseInt(color.slice(3,5),16)*.587 + parseInt(color.slice(5,7),16)*.114 > 150 ? "#12213A" : "#fff";
    el("meta").appendChild(s);
  }
  const gs = document.createElement("span");
  gs.className = "gen"; gs.textContent = `Génération ${ROMAN[current.gen]} · ${g.region}`;
  el("meta").appendChild(gs);

  renderStreak(); save();
  el("next").focus();
}

function submit(){
  if(!current){ round(); return; }
  const g = norm(el("guess").value);
  if(!g) return;
  const fr = norm(current.fr), en = norm(current.en);
  if(g === fr || g === en) reveal("ok");
  else if((fr.length >= 5 && lev(g,fr) <= 1) || (en.length >= 5 && lev(g,en) <= 1)) reveal("near");
  else reveal("no");
}

/* ---------- événements ---------- */
el("check").onclick = submit;
el("giveUp").onclick = () => current && reveal("no");
el("next").onclick = round;
el("hintBtn").onclick = () => {
  if(!current || hinted) return;
  hinted = true;
  el("hint").textContent = current.fr[0].toUpperCase() + " " + "·".repeat(Math.max(0, current.fr.replace(/[^A-Za-zÀ-ÿ0-9]/g,"").length - 1));
};
el("guess").addEventListener("keydown", e => { if(e.key === "Enter") submit(); });
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && revealed){ e.preventDefault(); round(); }
});
el("modeBtn").onclick = () => { state.sprites = !state.sprites; save(); renderProgress(); };
el("reset").onclick = () => {
  state = {gens: state.gens, seen:0, good:0, best:0, misses:{}, found:{}, sprites: state.sprites};
  streak = 0; save(); renderStreak(); renderProgress();
};

(async function init(){
  await load();
  renderChips(); renderStreak(); renderProgress(); round();
  probeHD();
})();
</script>
</body>
</html>
